# scenarios/calibration_seed1.yaml
#
# TUNING ONLY. Per SCHEMA.md's run_id rule, whatever server run uses this scenario
# must be tagged run_id starting "cal_" (e.g. cal_seed1) — that tagging happens when
# the API is started (P1/P3's call, likely inside run_demo.sh), not here. This file
# only controls what traffic gets sent.
#
# Nothing reported in the final numbers may be quoted from a run that used this file.
#
# UPDATED per P3's review: volume was too low to measure anything against 400
# attacker accounts / 46,000 requests. Bumped accounts and rates across the board;
# office went from 25 -> 60 as specifically requested. Also split `owner` into one
# distinct value per profile (was all "casual", which hid a 15x confidence gap
# between researcher and casual traffic on P3's test data).

run_label: calibration_seed1
seed: 1
duration_seconds: 3600
speed: 50            # 3600 simulated seconds compressed into 72 real seconds
api_url: http://localhost:8000

mix:
  - profile: casual
    accounts: 5
    owner: casual
    params:
      rate_per_min: 3.0

  - profile: batch
    accounts: 1
    owner: batch
    params:
      burst_size: 600

  - profile: bursty
    accounts: 2
    owner: bursty
    params:
      rate_per_min: 4.0
      retry_chance: 0.15

  - profile: researcher
    accounts: 3
    owner: researcher
    params:
      rate_per_min: 2.0

  - profile: multitenant
    accounts: 60
    owner: office_acme
    params:
      rate_per_min_per_account: 2.0
